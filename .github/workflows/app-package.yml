name: app-package
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          global-json-file: app/global.json
      - uses: microsoft/setup-msbuild@v2
      - name: Restore app
        run: dotnet restore app/src/SyntheticPen.App/SyntheticPen.App.csproj
      - name: Build MSIX (unsigned, sideload)
        run: msbuild app/src/SyntheticPen.Package/SyntheticPen.Package.wapproj /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:UapAppxPackageBuildMode=SideloadOnly /p:RestorePackagesConfig=true /restore
        shell: pwsh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyntheticPen-MSIX-${{ github.ref_name }}
          path: |
            app/src/SyntheticPen.Package/AppPackages/**/*.msix
            app/src/SyntheticPen.Package/AppPackages/**/*.msixbundle
          if-no-files-found: warn
